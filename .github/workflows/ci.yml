name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Prisma generate (run by postinstall) and `next build` both touch
    # env-validated code paths. The values themselves don't need to be real
    # — no DB connection is made during build.
    env:
      DATABASE_URL: postgresql://user:pass@ci-placeholder/synapse?sslmode=require
      AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
      AUTH_TRUST_HOST: "true"
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
